<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local PPTD renderer</title>
    <style>html,body{margin:0;min-height:100%;background:#f5f6f8;font:14px system-ui,sans-serif}#status{padding:8px 12px;color:#374151}#pages{display:grid;gap:16px;padding:16px}</style>
  </head>
  <body>
    <div id="status">本地渲染器就绪</div>
    <main id="pages"></main>
    <script type="module">
      const status = document.querySelector('#status');
      const pages = document.querySelector('#pages');
      const payload = await fetch('./payload.json', { cache: 'no-store' }).then((response) => response.json());
      status.textContent = `已载入 ${payload.pages?.length || 0} 页 PPTD`;
      for (const page of payload.pages || []) {
        const view = document.createElement('div');
        view.dataset.page = page.path || '';
        view.innerHTML = page.svg || '<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540"><text x="20" y="40">页面未渲染</text></svg>';
        view.style.cssText = 'width:960px;max-width:100%;aspect-ratio:16/9;border:1px solid #d1d5db;background:white;overflow:hidden';
        pages.append(view);
      }
    </script>
  </body>
</html>
