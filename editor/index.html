<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>NeoDeck Local</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">N</span><span><strong>NeoDeck</strong><small>LOCAL PPTD</small></span></div>
        <div class="toolbar" aria-label="文件工具栏">
          <button class="button button-primary" id="open-folder" type="button">打开项目</button>
          <button class="button" id="open-demo" type="button">示例</button>
          <button class="icon-button" id="undo" title="撤销" type="button" disabled>↶</button>
          <button class="icon-button" id="redo" title="重做" type="button" disabled>↷</button>
          <button class="icon-button" id="play" title="播放动画" aria-label="播放动画" aria-pressed="false" type="button">▶</button>
          <button class="button button-primary" id="export" type="button">导出 PPTX</button>
        </div>
        <div class="document-meta"><strong id="document-title">本地演示文稿</strong><small id="document-path">尚未打开项目</small></div>
        <div class="topbar-actions"><span class="status-pill" id="connection-status"><i></i><span id="connection-label">本地内核</span></span><span class="save-state" id="save-state">未保存</span><button class="icon-button" id="toggle-activity" title="活动记录" type="button">☰</button></div>
      </header>
      <main class="workspace">
        <aside class="sidebar slide-sidebar"><div class="panel-heading"><strong>页面</strong><span id="page-count">0</span></div><div class="slide-list" id="slide-list"></div><div class="sidebar-actions"><button id="add-page" type="button">＋ 新页面</button><button id="duplicate-page" type="button">复制</button><button id="delete-page" type="button">删除</button></div></aside>
        <section class="canvas-area"><div class="canvas-toolbar"><button class="icon-button" id="zoom-out" title="缩小" type="button">−</button><span id="zoom-label">100%</span><button class="icon-button" id="zoom-in" title="放大" type="button">＋</button><span class="canvas-hint">选择页面元素以编辑</span></div><div class="canvas-scroll"><div id="canvas-frame"><div id="canvas"></div></div></div></section>
        <aside class="sidebar inspector"><div class="panel-heading"><strong>格式</strong><span id="selection-label">未选择</span></div><div id="inspector-body" class="inspector-body"><p class="empty-state">从左侧选择页面，再选择一个元素。</p></div><div class="layer-panel"><div class="panel-heading"><strong>图层</strong></div><ol id="layer-list"></ol></div></aside>
      </main>
      <aside class="activity-panel" id="activity-panel" aria-hidden="true"><div class="panel-heading"><strong>活动记录</strong><button class="icon-button" id="close-activity" type="button">×</button></div><ol id="activity-list"></ol></aside>
    </div>
    <dialog id="open-dialog"><form method="dialog"><div class="dialog-heading"><h2>打开 PPTD 项目</h2><button class="icon-button" value="cancel" type="submit">×</button></div><p>选择包含 .pptd、pages 和 media 的完整目录。</p><button class="open-choice open-choice-primary" id="choose-writable-folder" type="button">选择项目文件夹</button><button class="open-choice" id="upload-folder" type="button">上传项目文件夹（只读）</button></form></dialog>
    <input id="folder-fallback" type="file" webkitdirectory multiple hidden />
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
